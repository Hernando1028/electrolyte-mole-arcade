<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>离子反应实验室</title>
<style>
:root{color-scheme:dark;--sky:#82eff0;--ink:#10213e;--cream:#fff8e3;--gold:#ffd15a;--muted:#bed4ea;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#08182c;color:var(--cream)}
button,input{font:inherit}
button{touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:.26cqw solid #fff274;outline-offset:.15cqw}
.shell{container-type:inline-size;width:min(100vw,133.333dvh,1440px);aspect-ratio:4/3}
.game{position:relative;isolation:isolate;overflow:hidden;width:100%;height:100%;background:#142e53 var(--play-art) center/100% 100% no-repeat}
.game[data-screen="home"]{background-image:var(--lobby-art)}
header{position:absolute;z-index:3;top:3.05cqw;left:6.85cqw;right:6.85cqw;display:flex;align-items:center;gap:.8cqw}
.branding{display:flex;min-width:0;align-items:center;gap:.68cqw}
.branding h1{margin:0;font-size:1.91cqw;font-weight:900;white-space:nowrap;line-height:1}
.branding p{display:none}
.ip-hero,.ion-icon,.locked-hero{position:relative;overflow:hidden;isolation:isolate;background:#fff;line-height:0}
.ip-hero{width:3.65cqw;aspect-ratio:1;flex:none;border-radius:27%}
.ip-hero img,.ion-icon img,.locked-hero img{position:absolute;width:137.2%;height:auto;left:-16.28%;top:-15.12%;pointer-events:none}
.ip-hero.cheer{animation:celebrate .42s ease-out}
@keyframes celebrate{40%{transform:translateY(-.45cqw) rotate(-7deg) scale(1.12)}}
nav{display:flex;gap:.53cqw;margin-left:auto;align-items:center}
.small,.primary{display:inline-flex;align-items:center;justify-content:center;gap:.4cqw;min-height:4.05cqw;padding:.52cqw .96cqw;white-space:nowrap;border:.115cqw solid #6694bd;border-radius:.95cqw;font-size:1.38cqw;font-weight:850;color:#f4faff;background:linear-gradient(#295679,#183752);box-shadow:0 .21cqw #09223b,inset 0 .095cqw #ffffff43}
.small:hover{background:#356889}
.small:active,.primary:active{transform:translateY(.17cqw)}

.primary{border-color:#ffe987;color:#3d270d;background:linear-gradient(#ffe68a,#ffbb38);box-shadow:0 .36cqw #a65d15,inset 0 .14cqw #fff8d6;text-shadow:0 .08cqw #fff3b8;font-weight:950}
.primary:hover{background:linear-gradient(#fff0ac,#ffcd4c)}
.game[data-screen="home"] header{justify-content:flex-end}
.game[data-screen="home"] #start,.game[data-screen="home"] .branding,.game[data-screen="home"] .lab-hud,.game[data-screen="home"] main{display:none}
.game[data-screen="board"] #help,.game[data-screen="board"] #rank{display:none}
.home-screen{position:absolute;inset:0}
.game:not([data-screen="home"]) .home-screen{display:none}
.home-copy{position:absolute;left:7.5cqw;top:19.5cqw;width:43cqw}
.home-copy h2{font-size:8.2cqw;line-height:.98;margin:0;letter-spacing:-.55cqw;color:#fff8df;font-weight:1000;text-shadow:0 .19cqw #a3dcf1,0 .61cqw #0f2653,0 .92cqw 1.15cqw #0e234692}
.home-copy h2 span{display:block}
.home-copy h2 span+span{margin-top:.59cqw;color:#ffe185}
.home-copy p{color:#e2f0ff;font-weight:730;font-size:1.82cqw;line-height:1.45;margin:2.25cqw 0 2.15cqw}
.home-actions .primary{min-height:6.3cqw;padding-inline:2.1cqw;font-size:2.35cqw}
.hero-stage{position:absolute;inset:0;pointer-events:none}
.locked-hero{display:block;position:absolute;left:58.2%;top:32.8%;width:24%;aspect-ratio:1;border-radius:27%;box-shadow:0 .8cqw 2.4cqw #082e6459,0 0 2.8cqw #cbf5ff40}
.lab-hud{display:flex;align-items:center;justify-content:center;gap:.58cqw;flex:1}
.stat{position:relative;display:flex;align-items:baseline;justify-content:center;gap:.54cqw;min-width:9.4cqw;padding:.5cqw .83cqw .6cqw;border:.11cqw solid #9eccdb;border-radius:.85cqw;color:#ccdfed;background:#0c2946e6;font-size:1.31cqw;font-weight:760;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.stat strong{color:#fff8e6;font-size:2.68cqw;line-height:1.05}
.time-card{min-width:13cqw;background:#081b36;color:#f4e9c6;border-color:#77c9df}
.time-card strong{color:#ffdc72;font-size:3.38cqw}
.clock{font-size:1.8cqw;color:#8ff3ee}
.timer{position:absolute;inset:auto .55cqw .15cqw;height:.2cqw;border-radius:1cqw;overflow:hidden;background:#34466c}
.timer i{display:block;height:100%;background:#7ff1df}
.time-card.urgent{background:#5e223e;border-color:#ffa8a3}
.time-card.urgent .timer i{background:#ff838c}
.time-card.final-count strong{animation:seconds-hit .45s ease-out}
@keyframes seconds-hit{38%{transform:scale(1.14);color:#fff}}
#start{min-width:5.1cqw}
.lab{position:absolute;inset:0;pointer-events:none}
.board-wrap{position:absolute;inset:16.1cqw 10.7cqw 15.8cqw;border-radius:1.7cqw;padding:.65cqw;background:transparent;pointer-events:auto}
.board{height:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:.53cqw}
.tile{position:relative;display:grid;justify-items:center;align-content:center;gap:.07cqw;padding:.24cqw .2cqw .48cqw;min-width:0;min-height:0;overflow:hidden;border:.17cqw solid var(--edge);border-bottom-width:.39cqw;border-radius:1.15cqw;background:linear-gradient(142deg,var(--light),var(--fill));box-shadow:inset 0 .16cqw #ffffffae,0 .19cqw .33cqw #020a22a0;color:#102745;user-select:none;-webkit-user-select:none}
.tile:not(:disabled):hover{filter:brightness(1.065)}
.tile:not(:disabled):active{transform:translateY(.13cqw);filter:brightness(.97)}
.tile.selected,.tile.hint{outline:.31cqw solid #ffe274;outline-offset:-.32cqw}
.tile.selected{box-shadow:inset 0 0 0 .54cqw #db8d31,0 0 .9cqw #ffd852a0}
.tile.hint{outline-style:dashed}
.tile.empty{background:#102c479d;border-color:#32668066;box-shadow:inset 0 .15cqw .65cqw #081e327a}
.tile.empty>*{visibility:hidden}
.tile.bad{animation:shake .25s}
@keyframes shake{25%,75%{transform:translateX(.45cqw);filter:sepia(.18)}50%{transform:translateX(-.45cqw)}}
.tile.fall{animation:deal .23s cubic-bezier(.2,.65,.4,1.08) var(--deal-delay,0ms) both}
@keyframes deal{from{transform:translateY(-.62cqw);opacity:.5}to{transform:none;opacity:1}}
.ion-icon{width:5.6cqw;aspect-ratio:1;border-radius:24%;pointer-events:none}
.ion-formula{font-size:2.63cqw;font-weight:900;line-height:1.18;white-space:nowrap;pointer-events:none}
.tile[data-ion="Ac"] .ion-formula{font-size:2.03cqw}
sup,sub{font-size:.64em;line-height:0}
.lab-foot{position:absolute;bottom:2.65cqw;left:8.9cqw;right:8.9cqw;display:grid;grid-template-columns:1fr auto;align-items:center;gap:.67cqw}
.reaction-strip{grid-column:1/-1;min-width:0;min-height:4.8cqw;display:flex;align-items:center;gap:.68cqw;padding:.45cqw .7cqw .45cqw .95cqw;border:.15cqw solid #79c9d0;border-radius:1.02cqw;background:#fff6db;color:#153751;box-shadow:0 .23cqw #093953}
.reaction-kind,.formula{flex:none;font-weight:900}
.reaction-kind{font-size:1.31cqw;color:#235d6b}
.formula{font-size:1.89cqw;line-height:1.22}
.formula:empty{display:none}
.note{font-size:1.2cqw;line-height:1.18;flex:1;min-width:0;color:#385571}
.pair-count{flex:none;white-space:nowrap;padding:.48cqw .69cqw;border-radius:.61cqw;background:#ffd56a;color:#102d49;font-size:1.41cqw;font-weight:900}
.lab-context{min-width:0;display:flex;align-items:center;gap:.61cqw;overflow:hidden;color:#e8f5ff;font-size:1.28cqw;line-height:1.2}
.footer-context{flex:none;color:#a3f5ee;border-right:.1cqw solid #75b6d6;padding-right:.6cqw}
.status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{pointer-events:auto;min-height:3.4cqw;padding-block:.33cqw;margin-bottom:.14cqw}
.fx-layer{position:absolute;inset:0;z-index:9;overflow:hidden;pointer-events:none}
.fx-layer *{pointer-events:none}
.ready-banner{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-7deg);padding:.62cqw 2.55cqw;background:#fff2b1;color:#142a58;border:.18cqw solid white;border-radius:.86cqw;box-shadow:0 .47cqw #18395e;font-size:4.8cqw;font-weight:950;white-space:nowrap;animation:ready .61s both}
@keyframes ready{0%{scale:.81;opacity:0}21%,71%{scale:1;opacity:1}100%{scale:1.09;opacity:0}}
.shade{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:3cqw;background:#061629aa}
.dialog{width:min(62cqw,100%);max-height:100%;overflow:auto;padding:2cqw;border:.17cqw solid #99e5e6;border-radius:1.43cqw;background:linear-gradient(140deg,#123450,#18294b);color:#f4fbff;font-size:1.61cqw;box-shadow:0 1cqw 4cqw #06122394}
.dialog h2{margin:0;font-size:2.85cqw}
.dialog p{line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:.7cqw}
.dialog input{width:100%;min-width:0;border:.12cqw solid #7da7c8;border-radius:.68cqw;background:#0b2543;color:#fff;padding:.6cqw .75cqw}
.review-list,.rank{list-style:none;padding:0;margin:1.2cqw 0}
.review-list li,.rank li{border-bottom:.1cqw solid #426184;padding:.62cqw .16cqw}
.review-list b{display:block;color:#fff3bd;font-size:1.68cqw}
.review-list span{color:#c1daed;font-size:1.3cqw}
.rank li{display:grid;grid-template-columns:3cqw 1fr auto;gap:.7cqw}
.rank li span{overflow-wrap:anywhere}
.shade:has(.result-dialog){padding:0;background:#0b2654 var(--result-art) center/100% 100% no-repeat}
.dialog.result-dialog{position:absolute;inset:0;width:100%;max-height:100%;background:transparent;box-shadow:none;border:0;padding:0;border-radius:0;overflow:hidden}
.result-dialog>.row{position:absolute;left:49%;right:7%;top:10.7%;z-index:2}
.result-dialog h2{font-size:3.5cqw;color:#fff1bd;text-shadow:0 .23cqw #192751}
.result-body{position:absolute;inset:0}
.result-hero{position:absolute;inset:0;pointer-events:none}
.result-hero .locked-hero{left:13%;top:34.4%;width:24%;box-shadow:0 .5cqw 1.55cqw #54380258}
.result-panel{position:absolute;left:48%;right:7%;top:24%;bottom:9%;display:flex;flex-direction:column;justify-content:center;gap:.83cqw;padding:1.45cqw 1.7cqw;border:.15cqw solid #a8d2ed66;border-radius:1.48cqw;background:#102648da}
.result-points{margin:0!important;font-size:1.7cqw;color:#fbe9a8;font-weight:880}
.result-points strong{display:inline-block;margin-right:.6cqw;font-size:7.2cqw;line-height:1;font-weight:950;letter-spacing:-.3cqw;color:#fff5c5;text-shadow:0 .3cqw #926735}
.result-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.47cqw}
.result-stats>*{padding:.56cqw .2cqw;text-align:center;background:#264773;border:.1cqw solid #7098bc;border-radius:.71cqw;color:#dbebfb;white-space:nowrap;font-size:1.24cqw}
.result-stats strong{display:block;font-size:2.64cqw;line-height:1.16;color:#aaffed}
.result-save-row,.result-actions{display:flex;gap:.46cqw}
.result-save-row input{flex:1}
.result-actions>.primary{flex:1}
.result-actions .small{padding-inline:.59cqw}
#saveStatus:empty{display:none}
.rotate{display:none}
@media(orientation:portrait){.rotate{display:block;font-size:14px;color:#c0e2f3;margin:12px}.shell{align-self:end}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}.ready-banner,.burst-flash{display:none}.effect-label,.burst-combo{animation:none!important}}
.burst{position:absolute;left:50%;top:49%;width:0;height:0}
.burst-flash{position:absolute;left:0;top:0;width:25cqw;height:25cqw;border-radius:50%;background:radial-gradient(circle,#fffffff0 0%,#fff7de98 10%,#fff1e753 22%,transparent 61%);animation:burst-light .33s ease-out both}
@keyframes burst-light{from{transform:translate(-50%,-50%) scale(.23);opacity:.87}to{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
.burst-combo{position:absolute;bottom:5.15cqw;left:0;transform:translateX(-50%) rotate(-7deg);white-space:nowrap;font-size:5.65cqw;letter-spacing:-.09em;line-height:1.13;font-weight:950;color:#fff2a6;text-shadow:0 .25cqw #854363,0 .52cqw #321844,0 0 1.3cqw #3e1b63;-webkit-text-stroke:.08cqw #713956;animation:combo-hit .7s both}
@keyframes combo-hit{0%{opacity:0;scale:.62}24%{opacity:1;scale:1.14}40%,78%{opacity:1;scale:1}100%{opacity:0;scale:.96}}
.effect-label{position:absolute;top:5.15cqw;left:0;transform:translateX(-50%);display:flex;align-items:center;gap:.9cqw;white-space:nowrap;color:white;background:#1b1239f5;box-shadow:0 .28cqw .85cqw #0e071eac;border:.13cqw solid #b49ae8;border-radius:.95cqw;padding:.55cqw 1cqw;font-size:1.9cqw;font-weight:900;animation:label-bounce .95s both}
.effect-label b{color:#ffe681}
@keyframes label-bounce{0%{opacity:0;scale:.73}20%{opacity:1;scale:1.06}33%,80%{opacity:1;scale:1}100%{opacity:0}}
.solid-pop,.gas-pop,.liquid-pop,.water-pop{position:absolute;left:0;top:0;width:var(--size);height:var(--size)}
.solid-pop{border-radius:45% 55% 55% 42%;background:var(--product);box-shadow:0 0 .38cqw #241636,inset -.13cqw -.12cqw #0004;animation:precipitate .81s var(--wait) both}
.solid-pop.floc{border-radius:53% 43% 55% 36%;box-shadow:.36cqw .18cqw var(--product),-.32cqw .19cqw var(--product),0 0 .46cqw #241636}
@keyframes precipitate{0%{opacity:0;transform:translate(-50%,-50%) scale(.26)}25%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-120% + var(--dy))) scale(1.1)}77%{opacity:1;transform:translate(var(--dx),var(--fall))}100%{opacity:0;transform:translate(var(--dx),calc(var(--fall) * 1.23)) scale(.88)}}
.gas-pop{border-radius:50%;background:transparent;border:.15cqw solid #fff;box-shadow:inset .18cqw .17cqw #ffffff8c,0 0 .32cqw #251437;animation:bubble-up .94s var(--wait) both}
@keyframes bubble-up{0%{opacity:0;transform:translate(-50%,50%) scale(.3)}20%,70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--rise)) scale(1.3)}}
.water-pop{width:3cqw;height:1.8cqw;border:.13cqw solid white;border-radius:50%;box-shadow:0 0 .32cqw #251437;animation:water-ring .6s var(--wait) both}
@keyframes water-ring{from{transform:translate(-50%,-50%) scale(.22);opacity:0}25%{opacity:1}to{transform:translate(-50%,-50%) scale(4.5);opacity:0}}
.liquid-pop{height:calc(var(--size) * .65);background:var(--product);border-radius:37% 63% 53% 47%;box-shadow:inset .12cqw .14cqw #ffc2c780;animation:liquid-splash .74s var(--wait) both}
@keyframes liquid-splash{0%{opacity:0;transform:scale(.25)}31%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1.13)}100%{opacity:0;transform:translate(var(--dx),var(--fall)) scale(.7)}}
.score-hit{animation:score-hit .25s both}
@keyframes score-hit{40%{background:#553c70;border-color:#ffdb6b;transform:scale(1.032)}}

.effect-label{background:#112e53;border-color:#8bf5e4;border-width:.16cqw}
.burst-combo{color:#ffe17a}

/* Responsive UI skins use generated artwork and fixed-size corner slices. */
:root{
 --unit:clamp(6px,1cqw,15px);
 --shell-width:min(100%, calc(100dvh * 1.52), 1440px);
}
html{min-height:100%;background:#203ca0}
body{min-height:100dvh;margin:0;display:grid;place-items:center;background:#213e9d var(--art-scene) center/cover fixed no-repeat;color:#fff8e6}
.shell{width:var(--shell-width);max-width:100%;height:100dvh;aspect-ratio:auto;container-type:inline-size}
.game,.game[data-screen="home"]{min-height:100%;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(5px,1.2cqh,13px);padding:clamp(7px,1.1cqw,17px) clamp(8px,2.5cqw,32px);background:none}
header{position:relative;inset:auto;display:flex;align-items:center;min-height:0;gap:clamp(4px,1cqw,14px)}
.branding{gap:.65cqw}
.branding h1{font-size:clamp(13px,1.65cqw,24px);text-shadow:0 1px 2px #12246d}
.ip-hero,.ion-icon,.locked-hero{overflow:visible;background:none;border:0;border-radius:0;box-shadow:none;line-height:normal}
.ip-hero img,.ion-icon img,.locked-hero img{position:static;display:block;width:100%;height:100%;object-fit:contain;margin:0;filter:drop-shadow(0 2px 1px #18397048)}
.ip-hero{width:clamp(25px,3.6cqw,49px)}
nav{gap:.42cqw}
.small,.primary,.stat{position:relative;isolation:isolate;color:#fff;border:0;background:none;box-shadow:none;text-shadow:0 1px 2px #03216b;border-radius:11px}
.small::before,.primary::before,.stat::before{content:"";position:absolute;inset:0;z-index:-1;border:calc(var(--unit) * 1.43) solid transparent;border-image:var(--skin) 72 105 fill / 1 stretch;pointer-events:none}
.small{--skin:var(--art-cyan);color:#082450;text-shadow:0 1px #ffffff69;padding:.7cqw 1cqw;font-size:clamp(11px,1.36cqw,19px);min-height:clamp(30px,4.06cqw,56px)}
.primary{--skin:var(--art-gold);color:#513008;text-shadow:0 1px #fff0a4;font-size:clamp(13px,1.65cqw,23px);min-height:clamp(34px,4.55cqw,64px);padding:.6cqw 1.3cqw}
.small:hover,.primary:hover{background:none;filter:brightness(1.11)}
.small:active,.primary:active{transform:translateY(2px);filter:brightness(.95)}
.stat{--skin:var(--art-counter);min-width:0;min-height:clamp(29px,4.15cqw,55px);padding:.46cqw .78cqw .56cqw;font-size:clamp(10px,1.18cqw,17px);overflow:visible}
.stat strong{font-size:clamp(16px,2.28cqw,35px)}
.time-card{background:none;border:0;color:#def6ff}
.time-card strong{font-size:clamp(19px,2.76cqw,42px)}
.time-card.urgent{background:none}
.time-card.urgent::before{filter:hue-rotate(125deg) saturate(1.3)}
.timer{inset:auto 13% 11%;height:max(2px,.17cqw);background:#365887}
.clock{font-size:clamp(12px,1.7cqw,24px)}
.lab-hud{flex:1;gap:.4cqw}
.game[data-screen="home"]{grid-template-rows:auto 1fr}
.home-screen{position:relative;inset:auto;display:grid;gap:4cqw;grid-template-columns:1fr .76fr;align-items:center;width:min(100%,1100px);margin:auto;min-height:0;padding:3cqw 4cqw}
.home-copy,.hero-stage,.locked-hero{position:relative;inset:auto;width:auto;top:auto;left:auto}
.home-copy h2{font-size:clamp(41px,7.1cqw,100px)}
.home-copy p{max-width:28em;font-size:clamp(14px,1.75cqw,25px)}
.home-actions .primary{min-height:clamp(48px,6.45cqw,86px);padding-inline:2.5cqw;font-size:clamp(17px,2.34cqw,32px)}
.hero-stage{display:grid;place-items:center;isolation:isolate}
.hero-stage::before{content:"";position:absolute;z-index:-1;inset:7%;background:radial-gradient(ellipse,#76ffff65,transparent 67%)}
.locked-hero{width:82%;aspect-ratio:1}
main{min-height:0}
.lab{position:relative;inset:auto;height:100%;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:max(5px,.55cqw)}
.board-wrap{position:relative;inset:auto;display:grid;min-height:0;padding:clamp(9px,1.65cqw,24px);isolation:isolate;border-radius:0}
.board-wrap::before,.reaction-strip::before,.dialog::before{content:"";position:absolute;inset:0;z-index:-1;border:clamp(10px,2.14cqw,32px) solid transparent;border-image:var(--skin) 49 fill / 1 stretch;pointer-events:none}
.board-wrap{--skin:var(--art-tray)}
.board{min-height:0;height:100%;width:min(100%,1120px);justify-self:center;gap:clamp(3px,.52cqw,8px);isolation:isolate}
.tile{--ceramic:grayscale(.95) brightness(1.055);isolation:isolate;background:none;border:0;box-shadow:none;align-content:normal;grid-template-rows:minmax(0,1fr) 25%;align-items:center;justify-items:center;overflow:visible;padding:5% 4% 6%;gap:0;border-radius:16%;filter:none}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--art-tile) center/100% 100% no-repeat;filter:var(--ceramic)}

 <div class="home-copy"><h2 id="homeTitle"><span>离子反应</span><span>实验室</span></h2><p>90 秒内找出能反应的离子，配对清空棋盘。</p>

const audioChannels = new Map();
let audioBlocked = false;

function tone(event, kind) {
 if (!sound || typeof Audio !== "function") return;
 const source = event === "pop"
  ? reactionAudio[kind][Math.min(Math.max(combo - 1,0),reactionAudio[kind].length - 1)]
  : gameAudio[event];
 const key = event === "start" || event === "end" ? "round" : source;
 if (!audioChannels.has(key)) audioChannels.set(key,[]);
 const channels = audioChannels.get(key);
 try {
  let player = key === "round" ? channels[0] : channels.find(channel => channel.paused || channel.ended);
  if (!player && channels.length < 4) {
   player = new Audio(source);
   player.preload = "auto";
   player.volume = {select:.55,wrong:.67,tick:.58,clear:.82}[event] ?? .93;
   channels.push(player);
  }
  if (!player) {
   player = channels.reduce((oldest,channel) => channel.currentTime > oldest.currentTime ? channel : oldest);
   player.pause();
  }
  if (player.src !== source) player.src = source;
  player.currentTime = 0;
   const playback = player.play();
  if (playback) playback.then(() => {
   audioBlocked = false;
   $("sound").title = "开关游戏音效";
  }).catch(error => {
   if (error.name === "AbortError" || !sound || audioBlocked) return;
   audioBlocked = true;
   $("sound").title = "音效未能播放";
   say("当前页面未能播放音效，可用系统浏览器打开 HTML 再试。");
  });
 } catch {
  $("sound").title = "音效未能播放";
 }
}
function showHome() {
 closeModal();
 $("game").dataset.screen = "home";
 $("effects").replaceChildren();
 $("homeStart").focus();
}
function begin() {
 tone("start");
 $("game").dataset.screen = "board";
 closeModal();
 clearInterval(timer);
 seed = initialSeed;
 score = combo = correct = bestCombo = attempts = 0;
 group = 0;
 lastSecond = 90;
 seenReactions.clear();
 completedThemes.length = 0;
 hints = 2;
 selected = null;
 highlighted = [];
 finished = recorded = false;
 events = [];
 left = duration;
 deadline = performance.now() + duration;
 playing = true;
 refillBoard();
 renderBoard(tiles.map((_,i) => i));
 updateStats();
 const ready = document.createElement("div");
 ready.className = "ready-banner";
 ready.textContent = "开始实验";
 $("effects").replaceChildren(ready);
 clearRule();
 setTimeout(() => ready.remove(),630);
 $("timeCard").classList.remove("final-count");
 $("reactionKind").textContent = "最近反应";
 $("formula").textContent = "";
 $("note").textContent = "成功配对后，查看配平的离子方程式。";
 $("start").textContent = "重开";
 say("先选一个离子，再选它的反应伙伴。");
 timer = setInterval(tick,100);
 tiles[0].focus({preventScroll:true});
}
function tick() {
 if (!playing) return;
 left = Math.max(0,deadline - performance.now());
 updateStats();
 const seconds = Math.ceil(left / 1000);
 if (seconds !== lastSecond) {
  lastSecond = seconds;
  if (seconds > 0 && seconds <= 3) {
   const card = $("timeCard");
   card.classList.remove("final-count");
   void card.offsetWidth;
   card.classList.add("final-count");
   tone("tick");
  }
 }
 if (!left) finish();
}
function choose(index) {
 if (!playing || overlay || board[index] === null) return;
 tick();
 if (!playing) return;
 if (selected === null || selected === index) {
  selected = selected === index ? null : index;
  renderBoard();
  const id = board[index];
  const color = solutionColors[id];
  if (selected !== null) tone("select");
  say(selected === null ? "已取消选择。" : "已选 " + ions[id][1] +
   (color ? " · " + color.label : "，再选一种离子。"));
  return;
 }
 const first = selected;
 const a = board[first], b = board[index];
 const recipe = groups[group].reactions.find(r => (r.a === a && r.b === b) || (r.b === a && r.a === b));
 selected = null;
 highlighted = [];
 attempts++;
 events.push({type:"pair",indices:[first,index],elapsed:Math.floor(duration-left)});
 if (!recipe) {
  renderBoard();
  combo = 0;
  updateStats();
  tiles[first].classList.add("bad");
  tiles[index].classList.add("bad");
  tone("wrong");
  say("这对离子在本关条件下没有对应的反应。");
  return;
 }
 combo++;
 correct++;
 bestCombo = Math.max(bestCombo,combo);
 seenReactions.set(recipe,(seenReactions.get(recipe) || 0) + 1);
 const gain = 100 + Math.min(combo-1,4) * 20;
 score += gain;
 updateStats();
 showProduct(recipe,gain);
 tone("pop",recipe.kind);
 say("反应成功 · +" + gain + " 分");
 board[first] = board[index] = null;
 if (board.some(Boolean)) {
  renderBoard();
 } else {
  showRule(groups[group]);
  if (group === groups.length - 1) {
   finish("全部主题已完成");
   return;
  }
  group++;
  refillBoard();
  renderBoard(tiles.map((_,i) => i));
  if (sound) {
   const currentBoard = board;
   setTimeout(() => {
    if (playing && board === currentBoard) tone("clear");
   },120);
  }
  say("本盘全部消除。进入「" + groups[group].name + "」。");
 }
}

function useHint() {
 if (!playing || overlay || hints < 1) return;
 tick();
 if (!playing) return;
 highlighted = findPair();
 if (!highlighted.length) return;
 hints--;
 combo = 0;
 selected = null;
 events.push({type:"hint",indices:[],elapsed:Math.floor(duration-left)});
 renderBoard();
 updateStats();
 say("试试描金边的这对离子，连击已重置。");
}
function readRank() {
 try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
  if (Array.isArray(saved)) localEntries = saved;
 } catch {}
 return localEntries;
}
function saveRank(name) {
 const chart = readRank();
 const previous = chart.find(entry => entry.name === name);
 if (!previous || score > previous.score || (score === previous.score && correct > previous.correct)) {
  localEntries = [...chart.filter(entry => entry.name !== name),{name,score,correct}];
 }
 try { localStorage.setItem(storageKey,JSON.stringify(localEntries)); }
 catch { return false; }
 return true;
}
function openModal(kind,title,content) {
 if (!overlay) lastFocus = document.activeElement;
 overlay = kind;
 $("dialog").classList.toggle("result-dialog",kind === "finish");
 $("dialog").classList.toggle("guide-dialog",kind === "guide");
 $("dialog").innerHTML = "<div class='row'><h2 id='dialogTitle'>" + title + "</h2><button class='small' id='close'>关闭</button></div>" + content;
 $("shade").hidden = false;
 for (const child of $("game").children) child.inert = child !== $("shade");
 $("close").addEventListener("click",closeModal);
 $("dialog").focus();
}
function closeModal() {
 if (!overlay) return;
 overlay = "";
 $("shade").hidden = true;
 for (const child of $("game").children) child.inert = false;
 if (lastFocus && !lastFocus.disabled) lastFocus.focus();
 else $("start").focus();
}
function drawRank(entries) {
 const list = $("rankList");
 list.replaceChildren();
 if (!entries.length) {
  list.textContent = "还没有成绩。完成一轮挑战即可上榜。";
  return;
 }
 [...entries].sort((a,b) => b.score-a.score || b.correct-a.correct).slice(0,10).forEach((entry,i) => {
  const row = document.createElement("li");
  for (const value of [i+1,entry.name,entry.score + " 分"]) {
   const cell = document.createElement("span");
   cell.textContent = value;
   row.append(cell);
  }
  list.append(row);
 });
}
async function showRank(message = "") {
 openModal("rank","排行榜","<p id='rankScope'></p><ol class='rank' id='rankList'></ol><button class='primary' id='rankDone'>返回棋盘</button>");
 $("rankDone").addEventListener("click",closeModal);
 const scope = $("rankScope");
 if (!endpoint) {
  scope.textContent = (message ? message + " " : "") + "本机前 10 名 · 每个昵称保留最佳成绩";
  drawRank(readRank());
  return;
 }
 scope.textContent = "正在读取排行榜…";
 try {
  const response = await fetch(endpoint,{credentials:"same-origin"});
  if (!response.ok) throw new Error("rank");
  const data = await response.json();
  if (!scope.isConnected) return;
  scope.textContent = message || "跨设备排行榜 · 前 10 名";
  drawRank(data.entries);
 } catch {
  if (scope.isConnected) scope.textContent = "排行榜暂时无法读取，请稍后再试。";
 }
}
function finish(reason = "时间到") {
 if (!playing) return;
 playing = false;
 tone("end");
 clearInterval(timer);
 selected = null;
 highlighted = [];
 renderBoard();
 updateStats();
 finished = true;
 $("start").textContent = "查看本轮成绩";
 say(reason + " · 完成 " + correct + " 次反应");
 showResult();
}
function showReview() {
 const themes = completedThemes.length ? "<h3>清盘规律</h3><ol class='review-list'>" +
  completedThemes.map(theme => "<li><b>" + theme.name + "</b><span>" + theme.rule + "</span></li>").join("") + "</ol>" : "";
 const rows = [...seenReactions].map(([r,count]) => "<li><b>" + equation(r) + "</b><span>" +
  r.label + " · " + count + " 次。 " + r.note + "</span></li>").join("");
 openModal("review","本轮反应",themes + "<ol class='review-list'>" + rows + "</ol><button class='primary' id='backResult'>返回成绩</button>");
 $("backResult").addEventListener("click",showResult);
}
function animateReward() {
 const container = document.createElement("div");
 container.className = "reward-coins";
 container.setAttribute("aria-hidden","true");
 for (let i=0;i<28;i++) {
  const coin = document.createElement("i");
  const direction = i % 2 ? 1 : -1;
  coin.style.setProperty("--wait",((i%7)*.07+.08)+"s");
  coin.style.setProperty("--mid-x",(direction*(5+(i*13)%28))+"cqw");
  coin.style.setProperty("--mid-y",(-12+(i*7)%14)+"cqw");
  coin.style.setProperty("--end-x",(direction*(8+(i*17)%32))+"cqw");
  coin.style.setProperty("--end-y",(25+(i*11)%24)+"cqw");
  container.append(coin);
 }
 $("dialog").append(container);
 const number = $("dialog").querySelector(".result-points strong");
 if (number && !matchMedia("(prefers-reduced-motion:reduce)").matches) {
  const target=score, started=performance.now();
  const frame=now=>{
   if (!number.isConnected) return;
   const progress=Math.min(1,(now-started)/900);
   number.textContent=Math.round(target*(1-Math.pow(1-progress,3)));
   if (progress<1) requestAnimationFrame(frame);
  };
  number.textContent="0";
  requestAnimationFrame(frame);
 }
 setTimeout(()=>container.remove(),2300);
}
function showResult() {
 const entry = endpoint ? "" : "<input id='name' name='nickname' maxlength='18' required aria-label='排行榜昵称' placeholder='排行榜昵称' autocomplete='nickname'>";
 const accuracy = attempts ? Math.round(correct / attempts * 100) + "%" : "—";
 const summary = "<p class='result-lead'>"+(correct ? "完成 " + correct + " 次正确配对" : "下一轮，从第一对开始。")+"</p><p class='result-points'><strong>" + score + "</strong>积分</p>" +
  "<div class='result-stats'><div><strong>" + correct + "</strong>正确配对</div><div><strong>" +
  bestCombo + "</strong>最高连击</div><div><strong>" + accuracy + "</strong>正确率</div></div>";
 const save = correct && !recorded ? "<form id='save'><div class='result-save-row'>" + entry +
  "<button class='primary' id='saveButton'>保存成绩</button></div><div id='saveStatus' role='status'></div></form>" :
  (recorded ? "<p>本轮成绩已记录。</p>" : "");
 const actions = "<p class='theme-count'>清空 "+completedThemes.length+" 页，回顾 "+completedThemes.length+" 条规律</p><div class='result-actions'><button class='primary' id='retry'>再挑战</button>" +
  (correct ? "<button class='small' id='review'>回看 " + seenReactions.size + " 种反应</button>" : "") +
  "<button class='small' id='backHome'>回首页</button></div>";
 
 const hero = "<div class='result-hero' aria-hidden='true'><div class='hero-stage'><span class='locked-hero'><img id='resultHero' alt=''></span></div></div>";
 openModal("finish",correct ? "挑战完成！" : "本轮结束","<div class='result-body'>" + hero + "<div class='result-panel'>" + summary + save + actions + "</div></div>");
 $("resultHero").src = onionIcon;
 if (correct) animateReward();
 $("retry").addEventListener("click",begin);
 $("backHome").addEventListener("click",showHome);
 if (correct) $("review").addEventListener("click",showReview);
 if (!correct || recorded) return;
 $("save").addEventListener("submit",async event => {
  event.preventDefault();
  if (!endpoint) {
   const name = $("name").value.trim();
   if (!name) { $("name").focus(); return; }
   const saved = saveRank(name);
   recorded = true;
   $("start").textContent = "查看本轮成绩";
   showRank(saved ? "成绩已保存。" : "浏览器存储不可用，本次成绩仅保留在当前页面。");
   return;
  }
  const button = $("saveButton"), status = $("saveStatus");
  button.disabled = true;
  try {
   const response = await fetch(endpoint,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({version:8,events})});
   if (!response.ok) throw new Error("save");
   if (status.isConnected) {
    recorded = true;
    $("start").textContent = "查看本轮成绩";
    showRank("成绩已保存。");
   }
  } catch {
   if (status.isConnected) {
    status.textContent = "成绩暂时无法保存，请重试。";
    button.disabled = false;
   }
  }
 });
}
$("board").replaceChildren(...Array.from({length:size},(_,index) => {
 const tile = document.createElement("button");
 tile.type = "button";
 const icon = document.createElement("span"), mascot = document.createElement("img");
 mascot.src = onionIcon;
 mascot.alt = "";
 mascot.draggable = false;
 icon.append(mascot);
 icon.className = "ion-icon";
 icon.setAttribute("aria-hidden","true");
 const formula = document.createElement("span");
 formula.className = "ion-formula";
 tile.append(icon,formula);
 tile.addEventListener("click",event => {
  choose(index);
  if (event.detail === 0 && playing && tile.disabled) {
   (tiles.slice(index + 1).concat(tiles).find(candidate => !candidate.disabled) || $("start")).focus();
  }
 });
 tile.addEventListener("keydown",event => {
  const visualColumns = matchMedia("(max-aspect-ratio:1/1)").matches ? 3 : columns;
  const step = {ArrowLeft:-1,ArrowRight:1,ArrowUp:-visualColumns,ArrowDown:visualColumns}[event.key];
  if (!step) return;
  event.preventDefault();
  for (let next = index + step; next >= 0 && next < size; next += step) {
   if (Math.abs(step) === 1 && Math.floor(next / visualColumns) !== Math.floor(index / visualColumns)) break;
   if (!tiles[next].disabled) { tiles[next].focus(); break; }
  }
 });
 tiles.push(tile);
 return tile;
}));
$("homeStart").addEventListener("click",begin);
$("start").addEventListener("click",() => {
 if (!playing) {
  if (finished) showResult();
  else begin();
  return;
 }
 openModal("restart","重新开始？","<p>本轮成绩会丢弃，倒计时仍在继续。</p><button class='primary' id='restartConfirm'>重新开始 90 秒</button>");
 $("restartConfirm").addEventListener("click",begin);
});
$("hint").addEventListener("click",useHint);
function showLobbyGuide(button,templateId) {
 button.focus();
 openModal("guide",button.textContent.trim(),"");
 const content = $(templateId).content.cloneNode(true);
 for (const sample of content.querySelectorAll("[data-pair]")) {
  const [a,b] = sample.dataset.pair.split(" ");
  sample.innerHTML = equation(recipes.find(r => r.a === a && r.b === b));
 }
 $("dialog").append(content);
 $("close").focus();
}
$("help").addEventListener("click",event => showLobbyGuide(event.currentTarget,"scoreGuideContent"));
$("chemGuide").addEventListener("click",event => showLobbyGuide(event.currentTarget,"chemGuideContent"));
$("rank").addEventListener("click",() => showRank());
function syncSound() {
 $("sound").textContent = sound ? "声音开" : "声音关";
 $("sound").setAttribute("aria-pressed",String(sound));
}
syncSound();
$("sound").addEventListener("click",() => {
 sound = !sound;
 syncSound();
 try { localStorage.setItem(soundKey,sound ? "on" : "off"); } catch {}
 if (sound) tone("start");
 else for (const player of [...audioChannels.values()].flat()) player.pause();
});
document.addEventListener("keydown",event => {
 if (!overlay) return;
 if (event.key === "Escape") { closeModal(); return; }
 if (event.key !== "Tab") return;
 const controls = [...$("dialog").querySelectorAll("button:not(:disabled),input,[tabindex='0']")];
 const first = controls[0], last = controls.at(-1);
 if (event.shiftKey && (document.activeElement === first || document.activeElement === $("dialog"))) {
  event.preventDefault();
  last.focus();
 } else if (!event.shiftKey && document.activeElement === last) {
  event.preventDefault();
  first.focus();
 }
});
seed = initialSeed;
refillBoard();
renderBoard();
updateStats();
</script></body></html>
